<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/style.css" />
    <script defer src="https://unpkg.com/feather-icons"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]]
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script defer src="assets/script.js"></script>
  </head>
  <body data-theme="light" data-page="blog">
    <div class="page-wrapper">
      <header class="navbar">
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="publications.html">Publications</a>
          <a href="blog.html" class="active">Blog</a>
          <a href="cv.html">CV</a>
        </nav>
        <button class="theme-toggle" data-theme-toggle data-theme-state="light">
          <span class="theme-icon" aria-hidden="true">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
          <span class="theme-label">Light</span>
        </button>
      </header>

      <section class="section section-highlight">
        <div class="section-heading">
          <h2>Research Notebook</h2>
        </div>
        <p class="meta">Short reflections on ongoing work, datasets, and service updates.</p>
        <div class="blog-layout">
          <main class="blog-main">
            <div id="blog-home" class="blog-home">
              <div class="blog-tools">
                <input id="blog-search" class="blog-search" type="search" placeholder="Search posts" aria-label="Search blog posts" autocomplete="off" />
              </div>
              <p id="blog-result-note" class="meta blog-result-note"></p>
              <div id="blog-feed" class="blog-feed"></div>
            </div>

            <article id="blog-article" class="blog-article" hidden>
              <button id="blog-back" class="blog-back" type="button">Back to Blog</button>
              <header class="article-header">
                <p class="meta" id="blog-article-meta">—</p>
                <h1 id="blog-article-title">Select a post</h1>
                <div id="blog-current-tags" class="post-tags"></div>
              </header>
              <nav id="blog-toc" class="blog-toc" aria-label="Post contents"></nav>
              <div class="blog-content"></div>
            </article>
          </main>

          <aside id="blog-sidebar" class="blog-sidebar" aria-label="Blog navigation">
            <section class="sidebar-panel profile-panel">
              <img src="assets/avatar.jpg" alt="Xiyu Zhou" />
              <div>
                <h3>Xiyu Zhou</h3>
                <p>Notes on AI, research, tools, and building this personal page.</p>
              </div>
            </section>
            <section class="sidebar-panel">
              <h3>Categories</h3>
              <div id="blog-categories" class="sidebar-links"></div>
            </section>
            <section class="sidebar-panel">
              <h3>Tags</h3>
              <div id="blog-tags" class="sidebar-tags"></div>
            </section>
            <section class="sidebar-panel">
              <h3>Archive</h3>
              <div id="blog-archive" class="sidebar-links"></div>
            </section>
            <section class="sidebar-panel">
              <h3>Recent</h3>
              <div id="blog-recent" class="sidebar-links"></div>
            </section>
          </aside>
        </div>
      </section>
    </div>
  </body>
</html>
